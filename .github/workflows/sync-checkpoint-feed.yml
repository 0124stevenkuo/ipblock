name: Sync Check Point IoC CSV

on:
  push:
    branches: [main]
    paths:
      - blockip.txt
      - protected_ips.txt
      - scripts/build_checkpoint_feed.py
      - .github/workflows/sync-checkpoint-feed.yml
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checkpoint-feed-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate CSV
        run: python3 scripts/build_checkpoint_feed.py
      - name: Commit when changed
        run: |
          if git diff --quiet -- blockip.txt blockip.csv; then
            echo "CSV already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blockip.txt blockip.csv
          git commit -m "Sync protected blocklists for PA and Check Point"
          git push
